# docker-compose.yml
services:
  api:
    image: ${REGISTRY}/${IMAGE_NAME}:${VERSION}
    container_name: file-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3